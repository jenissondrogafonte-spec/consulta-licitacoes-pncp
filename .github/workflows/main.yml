name: Robô Sniper Automático 2025

on:
  schedule:
    - cron: '0 */2 * * *' # Roda a cada 2 horas
  workflow_dispatch: # Permite rodar manualmente

concurrency:
  group: coleta-pncp-group
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essencial para salvar o dados.json e checkpoint.txt

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 2. Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: 4. Sincronizar e Executar
        run: |
          # Garante que o robô comece com a versão mais recente do checkpoint
          git pull origin main --rebase || echo "Repositório já atualizado"
          python coleta_pncp.py

      - name: 5. Submeter Dados ao Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add dados.json checkpoint.txt
          
          # Verifica se houve mudanças para evitar erro de commit vazio
          if git diff --cached --quiet; then
            echo "Nenhum dado novo encontrado nesta rodada."
            exit 0
          fi

          git commit -m "🤖 Progresso Automático: $(cat checkpoint.txt)"
          git push origin main
