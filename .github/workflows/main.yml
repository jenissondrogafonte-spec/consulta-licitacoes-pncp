name: PNCP Sniper Turbo

on:
  schedule:
    # Roda a cada 2 horas como backup
    - cron: '0 */2 * * *'
  workflow_dispatch:      # Permite rodar manualmente

# --- CORREÇÃO DO ERRO ---
# Isso garante que apenas 1 robô rode por vez, mas NÃO cancela o anterior.
# O novo fica na fila esperando o velho terminar (fila indiana).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write  # Necessário para o robô se auto-reiniciar

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de coleta
      run: python coleta_pncp.py

    - name: Commit e Push das atualizações
      run: |
        git config --global user.name "jenissonb88-bot"
        git config --global user.email "bot@github.com"
        git add dados.json checkpoint.txt
        # Se não houver mudança, ele avisa e segue sem erro
        git commit -m "Auto Update: $(date +'%d/%m/%Y %H:%M')" || echo "Sem mudanças no banco de dados"
        git push

    # Pequena pausa de segurança antes de reiniciar
    - name: 🔄 Reiniciar Loop (Auto-Trigger)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Aguardando 10 segundos para limpar processos..."
        sleep 10
        echo "Reiniciando o workflow para o próximo dia..."
        gh workflow run main.yml
