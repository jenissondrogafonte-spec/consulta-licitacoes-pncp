name: PNCP Sniper Turbo

on:
  schedule:
    # Backup: se o loop falhar, ele tenta reiniciar a cada 30 min
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Impede que dois robôs rodem ao mesmo tempo e estraguem o JSON
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write  # Necessário para reiniciar o workflow

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de coleta
      run: python coleta_pncp.py

    - name: Commit e Push das atualizações
      run: |
        git config --global user.name "jenissonb88-bot"
        git config --global user.email "bot@github.com"
        git add dados.json checkpoint.txt
        # Se não houver mudança, não falha
        git commit -m "Auto Update: $(date +'%d/%m/%Y %H:%M')" || echo "Sem mudanças"
        git push

    - name: 🔄 Reiniciar Loop (Auto-Trigger)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Reiniciando o workflow para o próximo dia..."
        gh workflow run main.yml
