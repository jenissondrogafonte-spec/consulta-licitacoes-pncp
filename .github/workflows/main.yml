name: PNCP Sniper Turbo

on:
  schedule:
    # Roda a cada 2 horas (00:00, 02:00, 04:00, etc.)
    - cron: '0 */2 * * *'
  workflow_dispatch:      # Permite rodar manualmente no botão

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar script de coleta
      run: python coleta_pncp.py

    - name: Commit e Push das atualizações
      run: |
        git config --global user.name "jenissonb88-bot"
        git config --global user.email "bot@github.com"
        git add dados.json checkpoint.txt
        git commit -m "Auto Update: $(date +'%d/%m/%Y %H:%M')" || echo "Sem mudanças"
        git push
