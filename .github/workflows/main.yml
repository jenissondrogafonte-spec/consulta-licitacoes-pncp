name: PNCP Sniper 15 Dias

on:
  schedule:
    # Roda dia 1 e dia 16 de todo mês às 06:00 da manhã
    - cron: '0 6 1,16 * *'
  workflow_dispatch:       # Permite rodar manualmente se precisar testar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Define um limite de tempo de quase 6h para evitar travamentos infinitos
    timeout-minutes: 350 

    permissions:
      contents: write

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3

    - name: Executar script de coleta
      # O script deve rodar, baixar os 365 dias e TERMINAR (exit) para o salvar funcionar
      run: python coleta_pncp.py

    - name: Commit e Push das atualizações
      run: |
        git config --global user.name "jenissonb88-bot"
        git config --global user.email "bot@github.com"
        # Removemos o checkpoint.txt pois agora o Python calcula a data sozinho
        git add dados.json
        # Se não houver mudança, ele avisa e segue sem erro
        git commit -m "Relatorio Quinzenal: $(date +'%d/%m/%Y')" || echo "Sem novas licitações encontradas"
        git push
