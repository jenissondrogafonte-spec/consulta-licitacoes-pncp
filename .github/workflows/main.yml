name: PNCP Sniper Continuo

on:
  schedule:
    # Roda a cada 6 horas para garantir que complete os 365 dias
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 5h 55min (dá tempo do script parar com 5h30 e salvar)

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependências
      run: pip install requests urllib3

    - name: Executar Coleta Segura
      run: python coleta_pncp.py

    - name: Commit e Push (Salva Checkpoint e Dados)
      run: |
        git config --global user.name "jenissonb88-bot"
        git config --global user.email "bot@github.com"
        git add dados.json checkpoint.txt
        git commit -m "Progresso salvo: $(date +'%d/%m/%Y %H:%M')" || echo "Sem alterações"
        git push
