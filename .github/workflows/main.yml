name: Consulta Licitações PNCP

on:
  schedule:
    # Agendamento para rodar automaticamente todos os dias às 03:00 da manhã (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      data_inicio_forcada:
        description: 'Data Inicial Forçada (YYYY-MM-DD). Deixe em branco para usar o checkpoint.'
        required: false
        default: ''
        type: string
      single_run:
        description: 'Ativar Single Run (Rodar apenas o dia atual/forçado e parar a fila)'
        required: false
        default: false
        type: boolean

jobs:
  coleta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Baixar o código do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: 🚀 Executar script de Coleta (coleta_pncp.py)
        env:
          DATA_INICIO_FORCADA: ${{ github.event.inputs.data_inicio_forcada }}
          SINGLE_RUN: ${{ github.event.inputs.single_run }}
        run: |
          # Desativa a parada imediata por erro para podermos ler o sys.exit(2)
          set +e
          python coleta_pncp.py
          
          # Captura o código de saída do script
          EXIT_CODE=$?
          echo "SCRIPT_EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV
          
          # Se o erro for diferente de 0 (Sucesso) e 2 (Continuar Fila), quebra a Action com erro real
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 2 ]; then
            exit $EXIT_CODE
          fi

      - name: 💾 Salvar e enviar arquivos (Commit & Push)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Adiciona os arquivos de banco e checkpoint
          git add dados.json checkpoint.txt || true
          
          # Verifica se há mudanças. Se houver, commita e faz o push
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚙️ Coleta 1 dia concluída: $(date +'%d/%m/%Y %H:%M')" && git push)

      - name: 🔄 Acionar próxima rotina (Efeito Dominó)
        if: env.SCRIPT_EXIT_CODE == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O código 2 significa que ainda há dias pendentes até hoje.
          # Aciona este mesmo workflow novamente para continuar a fila.
          gh workflow run main.yml
